<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega3Daily Performance Optimization</title>
    <style>
        /* Critical CSS */
        :root {
            --primary-color: #26d0ce;
            --secondary-color: #1f9bc2;
            --text-color: #0a2342;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
    </style>
    <!-- Preload critical assets -->
    <link rel="preload" href="assets/fonts/fontawesome-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/images/hero-background.webp" as="image">
    
    <!-- Defer non-critical CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css" media="print" onload="this.media='all'">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img 
                    src="assets/images/logo/omega-3-daily-logo.jpeg" 
                    alt="Omega 3 Daily Logo" 
                    style="max-height: 75px;"
                />
                <span class="ms-3 fw-bold text-dark">Omega3Daily</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Optimized content will be added here -->
    <script>
        // Lazy loading and performance optimization
        document.addEventListener('DOMContentLoaded', () => {
            // Defer image loading
            const lazyImages = document.querySelectorAll('img.lazy');
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove('lazy');
                        imageObserver.unobserve(img);
                    }
                });
            });

            lazyImages.forEach(img => imageObserver.observe(img));

            // Performance monitoring
            if ('performance' in window) {
                window.addEventListener('load', () => {
                    const timing = window.performance.timing;
                    const loadTime = timing.loadEventEnd - timing.navigationStart;
                    console.log(`Page load time: ${loadTime}ms`);
                });
            }
        });
    </script>
</body>
</html>
